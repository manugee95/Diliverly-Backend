<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>{{subject}}</title>
  <style>
    body {
      background-color: #f6f8fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
    }
    .header {
      padding: 20px;
      text-align: center;
      background: #0f172a;
    }
    .header img {
      height: 36px;
    }
    .content {
      padding: 32px;
      color: #0f172a;
      line-height: 1.6;
    }
    .footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    .code {
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://yourdomain.com/logo.png" />
    </div>

    <div class="content">
      {{body}}
    </div>

    <div class="footer">
      © {{year}} Diliverly. All rights reserved.
    </div>
  </div>
</body>
</html>
